name: Verify content and site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify Markdown content schema
        run: ruby scripts/verify_content_schema.rb

      - name: Build production site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Verify generated site
        run: |
          ruby scripts/verify_site.rb
          ruby scripts/verify_pinned_home.rb

      - name: Run automation tests
        run: ruby -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
